[package]
name = "brain-planner"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Brain Platform — planning, task graph, optimization, tool selection"

[dependencies]
brain-core = { path = "../brain-core" }
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
