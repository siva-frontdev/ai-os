[package]
name = "brain-model"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Brain Platform — provider-neutral AI model abstraction layer (traits only)"

[dependencies]
brain-core = { path = "../brain-core" }
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
