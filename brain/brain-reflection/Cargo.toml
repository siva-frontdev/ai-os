[package]
name = "brain-reflection"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Brain Platform — reflection, mistake detection, improvement generation, lesson store"

[dependencies]
brain-core = { path = "../brain-core" }
brain-goals = { path = "../brain-goals" }
memory-core = { path = "../../crates/memory-core" }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
