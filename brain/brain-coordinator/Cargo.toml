[package]
name = "brain-coordinator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Brain Platform — top-level coordinator that orchestrates all brain subsystems"

[dependencies]
brain-core = { path = "../brain-core" }
brain-goals = { path = "../brain-goals" }
brain-planner = { path = "../brain-planner" }
brain-policy = { path = "../brain-policy" }
brain-reasoner = { path = "../brain-reasoner" }
brain-decision = { path = "../brain-decision" }
brain-reflection = { path = "../brain-reflection" }
brain-learning = { path = "../brain-learning" }
brain-workflow = { path = "../brain-workflow" }
memory-core = { path = "../../crates/memory-core" }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
