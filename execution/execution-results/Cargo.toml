[package]
name = "execution-results"
version.workspace = true
edition.workspace = true
description = "Execution Platform — result collection, parsing, artifact storage, routing"

[dependencies]
execution-core = { path = "../execution-core" }
execution-runner = { path = "../execution-runner" }
execution-monitor = { path = "../execution-monitor" }
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"

[[bench]]
name = "results_bench"
harness = false
