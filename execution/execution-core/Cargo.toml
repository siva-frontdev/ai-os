[package]
name = "execution-core"
version.workspace = true
edition.workspace = true
description = "Execution Platform — shared foundation: types, events, errors, traits"

[dependencies]
ai-os-core = { path = "../../core" }
brain-core = { path = "../../brain/brain-core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
indexmap = "2"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"
proptest = "1"

[[bench]]
name = "core_bench"
harness = false
