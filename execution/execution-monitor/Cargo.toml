[package]
name = "execution-monitor"
version.workspace = true
edition.workspace = true
description = "Execution Platform — execution metrics, heartbeat, progress tracking"

[dependencies]
execution-core = { path = "../execution-core" }
execution-runner = { path = "../execution-runner" }
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync", "time", "rt"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }
tokio-test = "0.4"

[[bench]]
name = "monitor_bench"
harness = false
