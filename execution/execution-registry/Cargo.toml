[package]
name = "execution-registry"
version.workspace = true
edition.workspace = true
description = "Execution Platform — tool registry, capability matching, version handling"

[dependencies]
execution-core = { path = "../execution-core" }
ai-os-core = { path = "../../core" }
brain-core = { path = "../../brain/brain-core" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"

[[bench]]
name = "registry_bench"
harness = false
