[package]
name = "execution-sandbox"
version.workspace = true
edition.workspace = true
description = "Execution Platform — sandbox profiles, permission/capability validation"

[dependencies]
execution-core = { path = "../execution-core" }
ai-os-core = { path = "../../core" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[dev-dependencies]
criterion = { workspace = true }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"

[[bench]]
name = "sandbox_bench"
harness = false
