[package]
name = "execution-dispatcher"
version.workspace = true
edition.workspace = true
description = "Execution Platform — priority dispatch, backend selection, queue management"

[dependencies]
execution-core = { path = "../execution-core" }
execution-planner = { path = "../execution-planner" }
execution-sandbox = { path = "../execution-sandbox" }
execution-runner = { path = "../execution-runner" }
ai-os-core = { path = "../../core" }
brain-core = { path = "../../brain/brain-core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync", "rt"] }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"
memory-core = { path = "../../crates/memory-core" }
execution-runner = { path = "../execution-runner" }

[[bench]]
name = "dispatcher_bench"
harness = false
