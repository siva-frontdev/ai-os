[package]
name = "execution-resolution"
version.workspace = true
edition.workspace = true
description = "Execution Platform — autonomous capability resolution pipeline"

[dependencies]
execution-core = { path = "../execution-core" }
execution-discovery = { path = "../execution-discovery" }
execution-adapter = { path = "../execution-adapter" }
execution-cache = { path = "../execution-cache" }
execution-registry = { path = "../execution-registry" }
execution-planner = { path = "../execution-planner" }
execution-sandbox = { path = "../execution-sandbox" }
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"

[[bench]]
name = "resolution_bench"
harness = false
