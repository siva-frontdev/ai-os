[package]
name = "execution-planner"
version.workspace = true
edition.workspace = true
description = "Execution Platform — execution planning, dependency graph, scheduling"

[dependencies]
execution-core = { path = "../execution-core" }
execution-registry = { path = "../execution-registry" }
execution-sandbox = { path = "../execution-sandbox" }
ai-os-core = { path = "../../core" }
brain-core = { path = "../../brain/brain-core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"

[[bench]]
name = "planner_bench"
harness = false
