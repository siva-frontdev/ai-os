[package]
name = "execution-recovery"
version.workspace = true
edition.workspace = true
description = "Execution Platform — retry management, rollback planning, recovery policies"

[dependencies]
execution-core = { path = "../execution-core" }
execution-results = { path = "../execution-results" }
execution-dispatcher = { path = "../execution-dispatcher" }
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
  serde_json = "1"
  rand = "0.8"
  tracing = "0.1"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"

[[bench]]
name = "recovery_bench"
harness = false
