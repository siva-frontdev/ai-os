[package]
name = "ai-os-runtime"
version.workspace = true
edition.workspace = true
description = "AI-OS Runtime Platform — Scheduler, Supervisor, Session, Task, Context, State, Resource, Permission"

[dependencies]
ai-os-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "runtime_bench"
harness = false
