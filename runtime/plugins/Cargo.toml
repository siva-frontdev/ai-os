[package]
name = "ai-os-plugins"
version.workspace = true
edition.workspace = true
description = "AI-OS Real MCP Plugins — production tool plugins for the AI-OS MCP server"

[dependencies]
ai-os-mcp-server = { path = "../mcp-server" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "ai-os-mcp-server"
path = "src/main.rs"
