[package]
name = "runtime-integration-tests"
version.workspace = true
edition.workspace = true
description = "Cross-crate integration tests proving runtime registration, capability dispatch, runtime swap, and the email flow"
publish = false

[dependencies]
ai-os-runtime-api = { path = "../../runtime/ai-os-runtime-api" }
ai-os-runtime-manager = { path = "../../runtime/runtime-manager" }
ai-os-openclaw-runtime = { path = "../../runtime/openclaw-runtime", features = ["testkit"] }
brain-coordinator = { path = "../../brain/brain-coordinator" }
intelligence-core = { path = "../../intelligence/intelligence-core" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
