[package]
name = "intelligence-streaming"
version = "0.1.0"
edition = "2021"

[dependencies]
intelligence-core = { path = "../intelligence-core" }
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "time"] }
bytes = "1"
futures = "0.3"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
