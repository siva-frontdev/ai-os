[package]
name = "intelligence-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
intelligence-core = { path = "../intelligence-core" }
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "time"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
dashmap = "6"
