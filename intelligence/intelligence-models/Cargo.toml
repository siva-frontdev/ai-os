[package]
name = "intelligence-models"
version = "0.1.0"
edition = "2021"

[dependencies]
intelligence-core = { path = "../intelligence-core" }
intelligence-providers = { path = "../intelligence-providers" }
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "time"] }
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
