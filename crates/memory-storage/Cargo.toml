[package]
name = "memory-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }

[[bench]]
name = "storage_bench"
harness = false

[dependencies]
memory-core = { path = "../memory-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
