[package]
name = "capabilities"
version.workspace = true
edition.workspace = true
description = "Production-ready capability providers bridging OSAL and Execution Platform"

[dependencies]
execution-core = { path = "../../execution/execution-core" }
execution-registry = { path = "../../execution/execution-registry" }
execution-runner = { path = "../../execution/execution-runner" }
tokio = { version = "1", features = ["sync", "io-util", "process", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
thiserror = "2"
