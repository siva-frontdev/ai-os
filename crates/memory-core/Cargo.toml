[package]
name = "memory-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"
proptest = "1"

[[bench]]
name = "core_bench"
harness = false

[dependencies]
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"
