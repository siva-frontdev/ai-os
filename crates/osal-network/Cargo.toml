[package]
name = "osal-network"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
osal-core = { path = "../osal-core" }
osal-capabilities = { path = "../osal-capabilities" }
tokio = { version = "1", features = ["sync", "net"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_futures"] }

[[bench]]
name = "osal_network_bench"
harness = false
