[package]
name = "ai-os-capability-policy"
version.workspace = true
edition.workspace = true
description = "Capability policy layer (risk, confirmation, permissions, audit) evaluated before runtime dispatch"
license = "MIT"
publish = false

[dependencies]
ai-os-runtime-api = { path = "../../runtime/ai-os-runtime-api" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
