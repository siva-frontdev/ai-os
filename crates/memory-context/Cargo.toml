[package]
name = "memory-context"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"

[[bench]]
name = "context_bench"
harness = false

[dependencies]
memory-core = { path = "../memory-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4", "v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
