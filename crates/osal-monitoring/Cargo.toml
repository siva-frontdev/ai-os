[package]
name = "osal-monitoring"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
osal-core = { path = "../osal-core" }
osal-capabilities = { path = "../osal-capabilities" }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1"

[[bench]]
name = "osal_monitoring_bench"
harness = false
