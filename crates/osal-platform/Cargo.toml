[package]
name = "osal-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
osal-core = { path = "../osal-core" }
osal-capabilities = { path = "../osal-capabilities" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1"

[[bench]]
name = "osal_platform_bench"
harness = false
