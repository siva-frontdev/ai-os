[package]
name = "life-world-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "LIFE World Store — durable SQLite substrate for the canonical world model"

[dependencies]
ai-os-core = { path = "../../core" }
memory-core = { path = "../memory-core" }
memory-storage = { path = "../memory-storage" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "rt-multi-thread"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "store_bench"
harness = false
