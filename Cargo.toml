[workspace]
resolver = "2"
members = [
    "core",
    "runtime",
    "crates/osal-core",
    "crates/osal-capabilities",
    "crates/osal-filesystem",
    "crates/osal-process",
    "crates/osal-terminal",
    "crates/osal-network",
    "crates/osal-monitoring",
    "crates/osal-devices",
    "crates/osal-users",
    "crates/osal-platform",
    "crates/osal-linux",
  "crates/memory-core",
  "crates/memory-storage",
  "crates/memory-index",
  "crates/memory-working",
  "crates/memory-context",
  "crates/memory-cache",
  "crates/memory-episodic",
  "crates/memory-semantic",
  "crates/memory-knowledge",
  "brain/brain-core",
  "brain/brain-model",
  "brain/brain-policy",
  "brain/brain-goals",
  "brain/brain-planner",
  "brain/brain-reasoner",
  "brain/brain-decision",
  "brain/brain-reflection",
  "brain/brain-learning",
  "brain/brain-workflow",
  "brain/brain-coordinator",
  "perception/perception-core",
  "perception/perception-observer",
  "perception/perception-normalizer",
  "perception/perception-detector",
  "perception/perception-entities",
  "perception/perception-context",
    "perception/perception-anomaly",
    "perception/perception-fusion",
    "perception/perception-coordinator",
    "execution/execution-core",
    "execution/execution-registry",
    "execution/execution-planner",
    "execution/execution-dispatcher",
    "execution/execution-runner",
    "execution/execution-sandbox",
    "execution/execution-monitor",
    "execution/execution-results",
    "execution/execution-recovery",
    "execution/execution-coordinator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
