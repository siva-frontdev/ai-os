[package]
name = "life"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "AI-OS LIFE command-line interface — guided provider setup"

[[bin]]
name = "life"
path = "src/main.rs"

[lib]
name = "life"
path = "src/lib.rs"

[dependencies]
ai-os-plugins = { path = "../../runtime/plugins" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
