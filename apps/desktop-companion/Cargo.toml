[package]
name = "desktop-companion"
version.workspace = true
edition.workspace = true
description = "Desktop Companion — the AI-OS personal companion application"

[dependencies]
ai-os-capability-policy = { path = "../../crates/capability-policy" }
brain-coordinator = { path = "../../brain/brain-coordinator" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
