[package]
name = "perception-observer"
version.workspace = true
edition.workspace = true
description = "Perception Platform — observation providers, collectors, OSAL event adapters"

[dependencies]
perception-core = { path = "../perception-core" }
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
tokio = { version = "1", features = ["sync", "io-util"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"
