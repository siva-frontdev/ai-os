[package]
name = "perception-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
perception-core = { path = "../perception-core" }
perception-observer = { path = "../perception-observer" }
perception-normalizer = { path = "../perception-normalizer" }
perception-detector = { path = "../perception-detector" }
perception-entities = { path = "../perception-entities" }
perception-context = { path = "../perception-context" }
perception-anomaly = { path = "../perception-anomaly" }
perception-fusion = { path = "../perception-fusion" }
memory-core = { path = "../../crates/memory-core" }
ai-os-core = { path = "../../core" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }
tokio-test = "0.4"

[lib]
bench = false
