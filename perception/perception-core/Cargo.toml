[package]
name = "perception-core"
version.workspace = true
edition.workspace = true
description = "Perception Platform — shared foundation: types, events, errors, traits"

[dependencies]
ai-os-core = { path = "../../core" }
memory-core = { path = "../../crates/memory-core" }
osal-core = { path = "../../crates/osal-core" }
osal-capabilities = { path = "../../crates/osal-capabilities" }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-test = "0.4"
proptest = "1"

[[bench]]
name = "core_bench"
harness = false
